# Runs the test suite on every push to main and on every pull request.
# No DeepStream or GPU needed: the tests use small synthetic ONNX models and compile the
# C++ parser against a stand-in for DeepStream's header (g++ is preinstalled on ubuntu-latest).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # "Run workflow" button in the Actions tab

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything installed, as for development: every test runs, including the
  # comparisons with rfdetr's own decoder and preprocessing.
  full:
    name: full (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # CPU-only PyTorch first: the default Linux wheel pulls in ~3 GB of CUDA libraries we don't need.
      - name: Install PyTorch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v -rs

  # Only the base dependencies, as for `pip install -e .` (building from an .onnx export).
  # Checks that the package works without torch/rfdetr; the tests that need them are skipped.
  core:
    name: core (no torch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package (base dependencies only)
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -v -rs
