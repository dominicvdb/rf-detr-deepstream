[project]
name = "rfdetr-deepstream"
version = "0.1.0"
description = "Run RF-DETR models in NVIDIA DeepStream: model-to-bundle tool and nvinfer parser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "onnx",
    "onnxruntime",  # constant folding for keypoint models
]

[project.optional-dependencies]
# Needed to build from a pretrained name or a .pth checkpoint (exports to ONNX with rfdetr).
torch = ["rfdetr[onnx]", "torch", "torchvision"]
# Parity tests and development scripts.
dev = ["rfdetr[onnx]", "torch", "torchvision", "onnxruntime", "pillow", "opencv-python-headless", "av"]

[project.scripts]
rfdetr-deepstream = "rfdetr_deepstream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfdetr_deepstream"]
