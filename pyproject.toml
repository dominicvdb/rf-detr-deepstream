[project]
name = "rfdetr-deepstream"
version = "0.0.1"
description = "Run RF-DETR models in NVIDIA DeepStream: model-to-bundle tool and nvinfer parser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "onnxruntime",
]

[project.optional-dependencies]
# Needed for exporting from .pth and for bit-exact preprocessing (torchvision resize).
torch = ["rfdetr[onnx]", "torch", "torchvision"]
# Parity tests and development scripts (video decoding).
dev = ["opencv-python-headless"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfdetr_deepstream"]
