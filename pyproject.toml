[project]
name = "rfdetr-deepstream"
version = "0.1.0"
description = "Run RF-DETR models in NVIDIA DeepStream: model-to-bundle tool and nvinfer parser"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "onnx",
    "onnxruntime",  # constant folding for keypoint models
]

[project.optional-dependencies]
# Needed to build from a pretrained name or a .pth checkpoint (exports to ONNX with rfdetr).
# Pinned to the rfdetr minor version the reference decoder and the C++ parser mirror (1.12.1); raise it only after
# re-running the parity checks. RFDETR_VERSIONS in rfdetr_deepstream/bundle.py must match.
torch = ["rfdetr[onnx]>=1.12,<1.13", "torch", "torchvision"]
# Parity tests and development scripts.
dev = ["rfdetr[onnx]>=1.12,<1.13", "torch", "torchvision", "onnxruntime", "pillow", "opencv-python-headless", "av", "pytest"]

[project.scripts]
rfdetr-deepstream = "rfdetr_deepstream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rfdetr_deepstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
